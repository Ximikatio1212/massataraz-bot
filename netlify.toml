[build]
  # migrate deploy безопасно применяет только новые миграции (вместо рискованного db push)
  command = "npx prisma generate && npx prisma migrate deploy && npm run build"
  functions = "dist/netlify/functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/.prisma/**"]

[functions."telegram-webhook"]
  timeout = 26

[functions."app"]
  timeout = 26

[functions."keepwarm"]
  schedule = "*/5 * * * *"
  timeout = 26

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=3600"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=3600"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
